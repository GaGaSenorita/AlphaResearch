[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research"
version = "0.2.0"
description = "AlphaLDM research framework with verified, resumable factor discovery"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyqlib==0.9.7",
    "pyyaml>=6.0",
    "requests>=2.28",
    "openai>=1.0",
    "jsonschema>=4.0",
    "tqdm>=4.66",
    "torch>=2.1",
    "gpytorch>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
ffo = ["zss>=1.2.0", "gunicorn>=23.0.0"]

[project.scripts]
alpha-research = "alpha_research.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

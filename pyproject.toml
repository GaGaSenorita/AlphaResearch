[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research"
version = "0.2.0"
description = "Recovered AlphaLDM research framework with resumable continual discovery"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyqlib==0.9.7",
    "pyyaml>=6.0",
    "requests>=2.28",
    "openai>=1.0",
    "jsonschema>=4.0",
    "tqdm>=4.66",
    "torch>=2.1",
    "gpytorch>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
api = ["fastapi>=0.115,<1", "pydantic>=2.7,<3", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "psutil>=5.9,<8"]

[project.scripts]
alpha-research = "alpha_research.cli:main"
alphaldm-api = "alpha_research.api.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"alpha_research.api" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

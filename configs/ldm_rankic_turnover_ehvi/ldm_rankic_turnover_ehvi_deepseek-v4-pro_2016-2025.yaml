name: ldm_rankic_turnover_ehvi_deepseek-v4-pro_2016-2025
method: ldm_rankic_turnover_ehvi
environment: static
mode: real
description: >
  Seeded AlphaLDM on CSI300 with two independent behavioural-fingerprint GPs
  for Train RankIC and Train turnover. Candidate pools are acquired by
  mixed-direction Monte Carlo expected hypervolume improvement (EHVI): RankIC
  is maximised and turnover is minimised. Validation and Test retain the formal
  RankIC readout and hard 0.8 daily-RankIC correlation boundary. Override
  ldm-random-seed at runtime.
args:
  alphabench-root: "{repo_root}/external/AlphaBench"
  qlib-provider-uri: "{repo_root}/../quantaalpha_qlib_csi300/cn_data"
  ffo-url: http://127.0.0.1:19777
  ffo-label: close_return
  ffo-fast: true
  ffo-timeout: 600
  ffo-topk: 50
  ffo-n-drop: 5
  ffo-forward-n: 1
  no-ffo-use-cache: true
  ffo-max-attempts: 3
  market: csi300
  train-start: 2016-01-01
  train-end: 2020-12-29
  val-start: 2021-01-01
  val-end: 2021-12-29
  test-start: 2022-01-01
  test-end: 2025-12-26
  objective: rank_ic
  factor-budget: 30
  max-correlation: 0.8
  seed-group: all

  search-rounds: 38
  candidates-per-round: 8
  generator-parallel: 8
  history-shown: 24
  profile-start: 2019-01-01
  profile-end: 2020-12-29

  acquisition: ehvi
  ehvi-reference-rank-ic: -0.10
  # Turnover is minimised; 1.50 is worse than the observed seeded/pilot frontier.
  ehvi-reference-turnover: 1.50
  ehvi-n-samples: 128
  softmax-temperature: 1.0
  evaluate-per-round: 3
  ldm-max-refill-batches: 8
  gp-min-fit-data: 20
  gp-lengthscale: null
  gp-noise: 0.05
  gp-scale: 0.25
  gp-train-iters: 100
  gp-lr: 0.05
  ldm-random-seed: 42

  eval-parallel: 1
  llm-base-url: https://api.deepseek.com/v1
  llm-model: deepseek-v4-pro
  llm-api-key-env: ALPHARESEARCH_LLM_API_KEY
  llm-temperature: 0.7
  llm-timeout-seconds: 120
  llm-context-window: 1000000
  llm-max-tokens: 320000
  llm-reasoning-effort: high
  llm-thinking: true

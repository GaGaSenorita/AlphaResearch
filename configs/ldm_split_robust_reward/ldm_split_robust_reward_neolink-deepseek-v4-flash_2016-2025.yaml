name: ldm_split_robust_reward_neolink-deepseek-v4-flash_2016-2025
method: ldm_split_robust_reward
environment: static
mode: real
description: >
  Stage 2 Method 1 on CSI300 using the Yangtze AI Lab LiteLLM gateway and
  DeepSeek V4 Flash. This differs from ldm_standard only in the Train reward:
  one full 2016-2020 evaluation is aggregated to 20 calendar-quarter mean
  signed RankIC values and the GP target is their minimum.
args:
  alphabench-root: "{repo_root}/external/AlphaBench"
  qlib-provider-uri: "{repo_root}/../quantaalpha_qlib_csi300/cn_data"
  ffo-url: http://127.0.0.1:19777
  ffo-label: close_return
  ffo-fast: true
  ffo-timeout: 600
  ffo-topk: 50
  ffo-n-drop: 5
  ffo-forward-n: 1
  no-ffo-use-cache: true
  ffo-max-attempts: 3
  market: csi300
  train-start: 2016-01-01
  train-end: 2020-12-29
  val-start: 2021-01-01
  val-end: 2021-12-29
  test-start: 2022-01-01
  test-end: 2025-12-26
  objective: rank_ic
  search-objective: worst_rankic
  factor-budget: 30
  max-correlation: 0.8
  seed-group: all

  search-rounds: 38
  candidates-per-round: 8
  generator-parallel: 8
  history-shown: 24
  profile-start: 2019-01-01
  profile-end: 2020-12-29

  acquisition: ucb
  acquisition-beta: 2.0
  softmax-temperature: 1.0
  evaluate-per-round: 3
  ldm-max-refill-batches: 8
  gp-min-fit-data: 20
  gp-lengthscale: null
  gp-noise: 0.05
  gp-scale: 0.25
  gp-train-iters: 100
  gp-lr: 0.05
  ldm-random-seed: 42

  eval-parallel: 1
  llm-base-url: https://litellm.yangtzeailab.com/v1
  llm-model: neolink/technologies/deepseek-v4-flash
  llm-api-key-env: ALPHARESEARCH_LLM_API_KEY
  llm-temperature: 0.7
  llm-timeout-seconds: 120
  llm-context-window: 131072
  llm-max-tokens: 8192
  llm-reasoning-effort: none
